
spring.application.name=academic-service

# Server Configuration
server.port=8081

# File-backed H2 database keeps the academic records after the backend restarts.
spring.datasource.url=jdbc:h2:file:./data/academicdb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:academicdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE